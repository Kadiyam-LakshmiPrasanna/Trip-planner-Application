<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f7f3ff;
}


/* Forgot Password Card */
.container {
    width: 380px;

    padding: 35px;

    background: #ffffff;

    border-radius: 16px;

    text-align: center;

    box-shadow: 0 8px 25px rgba(80, 40, 140, 0.10);
}


/* Heading */
h2 {
    color: #4b227d;

    font-size: 24px;
    font-weight: 600;

    margin-bottom: 10px;
}


/* Description */
p.description {
    color: #777;

    font-size: 13px;
    line-height: 1.6;

    margin-bottom: 22px;
}


/* Form */
form {
    display: flex;
    flex-direction: column;
    gap: 13px;
}


/* Email */
input[type="email"] {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #ddd6e8;
    border-radius: 8px;

    outline: none;

    font-family: 'Poppins', sans-serif;
    font-size: 13px;

    transition: 0.2s;
}

input[type="email"]:focus {
    border-color: #7b3fc6;

    box-shadow: 0 0 0 3px rgba(123, 63, 198, 0.08);
}


/* Button */
button {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 8px;

    background: #6f35b5;

    color: white;

    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #5b2997;
}


/* Message */
#message {
    margin-top: 15px;

    color: #666;

    font-size: 12px;
}


/* Back to Login */
.back {
    margin-top: 20px;

    font-size: 12px;

    color: #777;
}

.back a {
    color: #6f35b5;

    text-decoration: none;

    font-weight: 500;
}

.back a:hover {
    text-decoration: underline;
}


/* Mobile */
@media (max-width: 450px) {

    .container {
        width: 90%;
        padding: 30px 25px;
    }
}
    </style>
    </style>
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <p id="message"></p>
    </div>
</body>
</html>
